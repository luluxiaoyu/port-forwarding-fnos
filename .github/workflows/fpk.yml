name: Build fnOS packages

on:
  workflow_call:
    inputs:
      tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: go.sum
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run check
      - run: go test -race ./...
      - name: Set package version from version tag
        if: inputs.tag != ''
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$RELEASE_TAG" =~ ^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "APP_VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          fi
      - run: node scripts/build_fpk.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: port-forwarding-fnos-amd64
          path: dist_fpk/*_amd64.fpk
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: port-forwarding-fnos-arm64
          path: dist_fpk/*_arm64.fpk
          if-no-files-found: error
